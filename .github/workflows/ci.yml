name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  # Source Runtime enforces this minimum before spawning its worker. Keep CI
  # aligned with the runtime and release workflows so host tests exercise the
  # real process path instead of failing at the version gate.
  NODE_VERSION: "24.15.0"
  PYTHON_VERSION: "3.12"

jobs:
  frontend-test:
    name: Frontend Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Biome lint check
        run: npm run lint:check

      - name: Check i18n catalog coverage
        run: npm run i18n:check

      - name: Run Vitest
        run: npm run test

      - name: Type check
        run: npx tsc -b

      - name: Build frontend
        run: npm run build

      - name: npm audit
        run: npm audit --audit-level moderate
        continue-on-error: true

  rust-check:
    name: Rust Check
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ./src-tauri
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri

      - name: Cargo check
        run: cargo check --all-targets

      - name: Cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Cargo test
        run: cargo test --all-targets

      - name: Cargo fmt check
        run: cargo fmt --check

  macos-arm-check:
    name: macOS ARM64 Check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri
          key: macos-aarch64

      - name: Install Node dependencies
        run: npm ci

      - name: Check i18n catalog coverage
        run: npm run i18n:check

      - name: Build frontend
        run: npm run build

      - name: Check Apple Silicon Rust target
        # This job validates cross-target Rust compilation, not release
        # packaging. The release workflow builds and verifies the real SEA
        # sidecar before bundling; disabling externalBin here avoids requiring
        # a fake artifact in a compile-only check.
        env:
          TAURI_CONFIG: '{"bundle":{"externalBin":[]}}'
        run: cargo check --manifest-path src-tauri/Cargo.toml --target aarch64-apple-darwin
